apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sync-wave-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Raani1011/Notes-API-Kubernetes.git
    targetRevision: main
    path: sync-wave-demo
  destination:
    server: https://kubernetes.default.svc
    namespace: deafault
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
